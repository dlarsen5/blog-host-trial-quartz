configuration:
  pageTitle: Neutron Universe
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: false
  analytics: null
  locale: en-US
  baseUrl: blog.neutronuniverse.com
  ignorePatterns: [private, templates, .obsidian]
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Fraunces
      body: -apple-system
      code: JetBrains Mono NL
    colors:
      lightMode: &palette
        light: var(--surface-0)
        lightgray: var(--line)
        gray: var(--ink-muted)
        darkgray: var(--ink)
        dark: var(--ink-bright)
        secondary: var(--ink-bright)
        tertiary: var(--atmos)
        highlight: var(--surface-1)
        textHighlight: var(--selection)
      darkMode: *palette
plugins:
  - source: '@quartz-community/note-properties'
    enabled: true
    options: { hidePropertiesView: true }
    order: 0
  - source: '@quartz-community/created-modified-date'
    enabled: true
    options:
      defaultDateType: published
      priority: [frontmatter, git, filesystem]
    order: 10
  - source: '@quartz-community/syntax-highlighting'
    enabled: true
    options:
      theme: { light: github-light, dark: github-dark }
      keepBackground: false
    order: 20
  - source: '@quartz-community/obsidian-flavored-markdown'
    enabled: true
    options: { enableInHtmlEmbed: false }
    order: 30
  - source: '@quartz-community/github-flavored-markdown'
    enabled: true
    order: 40
  - source: '@quartz-community/crawl-links'
    enabled: true
    options: { markdownLinkResolution: shortest }
    order: 60
  - source: '@quartz-community/description'
    enabled: true
    order: 70
  - source: '@quartz-community/latex'
    enabled: true
    options: { renderEngine: katex }
    order: 80
  - source: '@quartz-community/unlisted-pages'
    enabled: true
  - source: '@quartz-community/remove-draft'
    enabled: true
  - source: '@quartz-community/alias-redirects'
    enabled: true
  - source: '@quartz-community/content-index'
    enabled: true
    options: { enableSiteMap: true, enableRSS: true, rssFullHtml: true, rssLimit: 50 }
  - source: '@quartz-community/favicon'
    enabled: true
  - source: '@quartz-community/content-page'
    enabled: true
  - source: '@quartz-community/folder-page'
    enabled: false
  - source: '@quartz-community/article-title'
    enabled: true
    layout: { position: beforeBody, priority: 10, condition: not-index }
  - source: '@quartz-community/comments'
    enabled: true
    options:
      provider: giscus
      options:
        repo: dlarsen5/blog-host-trial-quartz
        repoId: R_kgDOVjHCLA
        category: Announcements
        categoryId: DIC_kwDOVjHCLM4DKZP0
        mapping: pathname
        lightTheme: solar-day
        darkTheme: solar-night
    layout: { position: afterBody, priority: 10, condition: post }
